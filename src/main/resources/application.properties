# Mainframe DB2连接配置
spring.datasource.jdbcUrl=jdbc:db2://mainframe-host:446/DBNAME
spring.datasource.username=db2user
spring.datasource.password=db2pass
spring.datasource.driver-class-name=com.ibm.db2.jcc.DB2Driver

# Hikari连接池配置 - 为Mainframe连接优化
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Mainframe DB2特定配置
spring.datasource.hikari.data-source-properties.currentSchema=SCHEMA
spring.datasource.hikari.data-source-properties.currentLockTimeout=0
spring.datasource.hikari.data-source-properties.useJDBC4ColumnNameAndLabelSemantics=2
spring.datasource.hikari.data-source-properties.progressiveStreaming=2
spring.datasource.hikari.data-source-properties.encoding=Cp1047

# SpringDoc OpenAPI Properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# 应用程序配置
app.load-test-data=false